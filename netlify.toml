[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/social-hub"
  to = "https://us-central1-consulenza-credipass.cloudfunctions.net/socialHub/social-hub/"
  status = 200
  force = true

[[redirects]]
  from = "/social-hub/*"
  to = "https://us-central1-consulenza-credipass.cloudfunctions.net/socialHub/social-hub/:splat"
  status = 200
  force = true
