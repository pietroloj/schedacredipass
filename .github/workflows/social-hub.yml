name: Social Hub tests
on:
  pull_request:
    paths: ['social_hub/**', 'firebase.social-hub.json', '.github/workflows/social-hub.yml']
  push:
    paths: ['social_hub/**', 'firebase.social-hub.json', '.github/workflows/social-hub.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r social_hub/requirements.txt
      - run: python -m unittest discover -s social_hub/tests -p test_hub.py
      - run: python -m unittest discover -s social_hub/tests -p test_cloud_http.py
      - run: python -m unittest discover -s social_hub/tests -p test_planner.py
      - run: python -m unittest discover -s social_hub/tests -p test_direct_oauth.py
      - run: python -m unittest discover -s social_hub/tests -p test_buffer.py
      - run: python -m unittest discover -s social_hub/tests -p test_auto_import.py
      - run: python -m unittest discover -s social_hub/tests -p test_community.py
      - run: python -m unittest discover -s social_hub/tests -p test_workspace.py
      - run: node social_hub/tests/test_planner_import.cjs
      - run: node social_hub/tests/test_unified_calendar.cjs
      - run: node social_hub/tests/test_batch_times.cjs
      - run: node social_hub/tests/test_shared_auth.cjs
      - run: node --check social_hub/web/app.js
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: social-hub-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g firebase-tools
      - name: Prepare Social Hub runtime
        run: |
          python -m venv social_hub/venv
          social_hub/venv/bin/pip install -r social_hub/requirements.txt
      - name: Deploy Social Hub codebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --config firebase.social-hub.json --only functions:social-hub --project consulenza-credipass --non-interactive
