name: Test Firestore Config

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "firebase.json"

jobs:
  test-firestore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify files
        run: |
          test -f firestore.rules || (echo "❌ firestore.rules mancante" && exit 1)
          test -f firebase.json || (echo "❌ firebase.json mancante" && exit 1)
          echo "✅ File Firestore presenti"

      - name: Validate Firebase project configuration
        run: |
          firebase use consulenza-credipass --token "${{ secrets.FIREBASE_TOKEN }}" || true
          echo "✅ Configurazione Firebase letta"
