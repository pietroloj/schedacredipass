name: Deploy Firebase Functions

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Debug repository
        run: |
          echo "=== DIRECTORY CORRENTE ==="
          pwd

          echo ""
          echo "=== FUNCTIONS/SRC/SERVICES ==="
          ls -la functions/src/services

          echo ""
          echo "=== CONTROLLO PREDELIBERA ==="

          if [ -f "functions/src/services/practiceFinancialCalculator.js" ]; then
            echo "✅ practiceFinancialCalculator.js TROVATO"
          else
            echo "❌ practiceFinancialCalculator.js NON TROVATO"
            exit 1
          fi

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Verify Predelibera module
        working-directory: functions
        run: |
          node -e "require('./src/services/practiceFinancialCalculator.js'); console.log('✅ Modulo Predelibera caricato correttamente')"

      - name: Ensure Firebase OAuth Secrets
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |

          echo "Controllo Secret Manager..."

          if ! firebase functions:secrets:access GOOGLE_OAUTH_CLIENT_ID \
            --project consulenza-credipass \
            --token "${{ secrets.FIREBASE_TOKEN }}" >/dev/null 2>&1
          then
            echo "Creo GOOGLE_OAUTH_CLIENT_ID"

            printf '%s' "$CLIENT_ID" >/tmp/clientid.txt

            firebase functions:secrets:set GOOGLE_OAUTH_CLIENT_ID \
              --data-file=/tmp/clientid.txt \
              --project consulenza-credipass \
              --token "${{ secrets.FIREBASE_TOKEN }}"
          else
            echo "GOOGLE_OAUTH_CLIENT_ID già presente"
          fi


          if ! firebase functions:secrets:access GOOGLE_OAUTH_CLIENT_SECRET \
            --project consulenza-credipass \
            --token "${{ secrets.FIREBASE_TOKEN }}" >/dev/null 2>&1
          then
            echo "Creo GOOGLE_OAUTH_CLIENT_SECRET"

            printf '%s' "$CLIENT_SECRET" >/tmp/clientsecret.txt

            firebase functions:secrets:set GOOGLE_OAUTH_CLIENT_SECRET \
              --data-file=/tmp/clientsecret.txt \
              --project consulenza-credipass \
              --token "${{ secrets.FIREBASE_TOKEN }}"
          else
            echo "GOOGLE_OAUTH_CLIENT_SECRET già presente"
          fi

      - name: Deploy Firebase Functions
        run: |
          firebase deploy \
            --only functions \
            --project consulenza-credipass \
            --token "${{ secrets.FIREBASE_TOKEN }}"
