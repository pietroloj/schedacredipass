name: Deploy Firebase Functions

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # npm install è usato perché la patch aggiunge nuove dipendenze
      # (imapflow, mailparser, nodemailer) e il package-lock potrebbe
      # non essere ancora aggiornato nel repository.
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Verify Mail Engine modules
        working-directory: functions
        run: |
          node --check src/gmail-oauth.js
          node --check src/gmail-api-engine.js
          node --check src/mail-admin-actions.js
          node --check src/mail-matcher.js
          node --check src/index.js

      - name: Sync Google OAuth secrets to Firebase Secret Manager
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          test -n "$CLIENT_ID" || (echo "CLIENT_ID mancante nei Repository secrets" && exit 1)
          test -n "$CLIENT_SECRET" || (echo "CLIENT_SECRET mancante nei Repository secrets" && exit 1)

          printf '%s' "$CLIENT_ID" > /tmp/google_oauth_client_id.txt
          printf '%s' "$CLIENT_SECRET" > /tmp/google_oauth_client_secret.txt

          firebase functions:secrets:set GOOGLE_OAUTH_CLIENT_ID \
            --data-file=/tmp/google_oauth_client_id.txt \
            --project consulenza-credipass \
            --token "${{ secrets.FIREBASE_TOKEN }}"

          firebase functions:secrets:set GOOGLE_OAUTH_CLIENT_SECRET \
            --data-file=/tmp/google_oauth_client_secret.txt \
            --project consulenza-credipass \
            --token "${{ secrets.FIREBASE_TOKEN }}"

          rm -f /tmp/google_oauth_client_id.txt /tmp/google_oauth_client_secret.txt

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project consulenza-credipass --token "${{ secrets.FIREBASE_TOKEN }}"
