<script>
    var firebaseConfig = {
        apiKey: "AIzaSyDDRWJpEhFb2zBB9MlkbEel_9cXOTTKBJ4",
        authDomain: "consulenza-credipass.firebaseapp.com",
        projectId: "consulenza-credipass",
        storageBucket: "consulenza-credipass.firebasestorage.app"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    var db = firebase.firestore();
    var storage = firebase.storage();
    var functionsFirebase = firebase.app().functions("us-central1");
    var tuttiIClienti = [];
    var sessioneConsulente = null;
    var expandedCollaboratorNames = {};
    var adminActiveUsers = [];
    var practiceToAssign = null;

    const STATO_PRATICA_CONFIG = {
        da_istruire: { label: "Da istruire", border: "#adb5bd", bg: "#f8f9fa", badge: "#6c757d" },
        istruttoria: { label: "Istruttoria", border: "#2f80ed", bg: "#f2f7ff", badge: "#2f80ed" },
        integrazione_documenti: { label: "Integrazione documenti", border: "#d39e00", bg: "#fffaf0", badge: "#b8860b" },
        caricato_banca: { label: "Caricato in banca", border: "#002d72", bg: "#eef4fb", badge: "#002d72" },
        valutazione_reddituale: { label: "Valutazione reddituale", border: "#7b61a8", bg: "#f7f4fb", badge: "#7b61a8" },
        delibera_reddituale_ok: { label: "Delibera reddituale OK", border: "#28a745", bg: "#f2fbf5", badge: "#28a745" },
        delibera_reddituale_ko: { label: "Delibera reddituale KO", border: "#dc3545", bg: "#fff4f5", badge: "#dc3545" },
        attesa_perizia: { label: "Attesa perizia", border: "#f0ad4e", bg: "#fff8ed", badge: "#d88a1d" },
        perizia_in_corso: { label: "Perizia in corso", border: "#e67e22", bg: "#fff5ec", badge: "#e67e22" },
        perizia_ok: { label: "Perizia OK", border: "#20a464", bg: "#f1fbf6", badge: "#20a464" },
        perizia_ko: { label: "Perizia KO", border: "#c62828", bg: "#fff2f2", badge: "#c62828" },
        attesa_documentazione_notarile: { label: "Attesa documentazione notarile", border: "#9a6b35", bg: "#fbf7f1", badge: "#9a6b35" },
        chiamata_atto: { label: "Chiamata d'atto", border: "#087f5b", bg: "#effaf6", badge: "#087f5b" },
        stipulato: { label: "Stipulato", border: "#198754", bg: "#effaf3", badge: "#198754" },
        sospesa: { label: "Sospesa", border: "#495057", bg: "#f1f3f5", badge: "#495057" },
        rinunciata: { label: "Rinunciata / KO", border: "#b02a37", bg: "#fff2f3", badge: "#b02a37" }
    };

    function getStatoPraticaConfig(stato) {
        return STATO_PRATICA_CONFIG[stato] || STATO_PRATICA_CONFIG.da_istruire;
    }



    function roleSession() {
        return String(
            sessioneConsulente?.profile?.ruolo ||
            "consulente"
        ).toLowerCase();
    }

    function secretaryCollaborators() {
        const ids =
            Array.isArray(
                sessioneConsulente?.profile?.collaboratori_visibili
            )
                ? sessioneConsulente.profile.collaboratori_visibili
                : [];

        return Array.from(
            new Set(
                ids
                    .map(x => String(x || "").trim())
                    .filter(Boolean)
            )
        );
    }

    function collaboratorNameMap() {
        const details =
            Array.isArray(
                sessioneConsulente?.profile?.collaboratori_visibili_dettagli
            )
                ? sessioneConsulente.profile.collaboratori_visibili_dettagli
                : [];

        const map = {};

        details.forEach(item => {
            const uid =
                String(
                    item?.uid || ""
                ).trim();

            if (!uid) return;

            map[uid] =
                `${item?.nome || ""} ${item?.cognome || ""}`
                    .trim()
                ||
                item?.email
                ||
                uid;
        });

        return map;
    }


    async function buildExpandedVisibility() {
        const role = roleSession();
        const myUid = String(sessioneConsulente?.user?.uid || "").trim();
        const directIds = secretaryCollaborators();
        const ids = new Set(directIds);
        const names = collaboratorNameMap();

        if (!["segreteria","responsabile"].includes(role)) {
            return { ids: Array.from(ids), names };
        }

        // Leggiamo i profili per espandere la gerarchia:
        // Segreteria -> Responsabile -> Consulenti del Responsabile.
        const snap = await db.collection("consulenti").get();
        const profiles = {};
        snap.forEach(doc => {
            const d = doc.data() || {};
            profiles[doc.id] = { uid: doc.id, ...d };
            const label = `${d.nome || ""} ${d.cognome || ""}`.trim() || d.email || doc.id;
            names[doc.id] = label;
        });

        if (role === "segreteria") {
            directIds.forEach(uid => {
                const p = profiles[uid];
                if (!p || String(p.ruolo || "").toLowerCase() !== "responsabile") return;

                // Il Responsabile è già visibile e aggiungiamo tutto il suo team.
                Object.values(profiles).forEach(c => {
                    if (
                        String(c.ruolo || "").toLowerCase() === "consulente" &&
                        String(c.responsabile_uid || "") === uid &&
                        c.attivo !== false
                    ) ids.add(c.uid);
                });

                // Compatibilità con associazioni responsabile legacy.
                (Array.isArray(p.collaboratori_visibili) ? p.collaboratori_visibili : [])
                    .forEach(cuid => ids.add(String(cuid || "").trim()));
            });
        }

        if (role === "responsabile") {
            Object.values(profiles).forEach(c => {
                if (
                    String(c.ruolo || "").toLowerCase() === "consulente" &&
                    String(c.responsabile_uid || "") === myUid &&
                    c.attivo !== false
                ) ids.add(c.uid);
            });
        }

        ids.delete("");
        return { ids: Array.from(ids), names };
    }


    async function loadAdminActiveUsers() {
        if (!sessioneConsulente?.isAdmin) return [];

        if (adminActiveUsers.length) return adminActiveUsers;

        const callable =
            functionsFirebase.httpsCallable("listActiveConsultants");

        const result = await callable();
        adminActiveUsers =
            Array.isArray(result?.data?.consultants)
                ? result.data.consultants
                : (Array.isArray(result?.data?.consulenti) ? result.data.consulenti : []);

        return adminActiveUsers;
    }

    async function setupAdminPracticeFilter() {
        if (!sessioneConsulente?.isAdmin) return;

        const wrapper = document.getElementById("collaboratorFilter");
        const select = document.getElementById("collaboratorSelect");
        if (!wrapper || !select) return;

        const users = await loadAdminActiveUsers();
        const myUid = String(sessioneConsulente.user.uid || "").trim();

        expandedCollaboratorNames = {};
        users.forEach(u => {
            expandedCollaboratorNames[u.uid] =
                `${u.nome || ""} ${u.cognome || ""}`.trim()
                || u.email
                || u.uid;
        });

        wrapper.classList.add("visible");
        select.innerHTML =
            `<option value="">Tutte le pratiche</option>` +
            `<option value="__mine__">Le mie pratiche</option>` +
            users
                .filter(u => String(u.uid || "") !== myUid)
                .map(u => {
                    const label =
                        `${u.nome || ""} ${u.cognome || ""}`.trim()
                        || u.email
                        || u.uid;
                    return `<option value="${escapeHtmlAttr(u.uid)}">${escapeHtml(label)} — ${escapeHtml(String(u.ruolo || ""))}</option>`;
                }).join("");
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeHtmlAttr(value) {
        return escapeHtml(value);
    }

    async function setupCollaboratorFilter() {
        const wrapper =
            document.getElementById(
                "collaboratorFilter"
            );

        const select =
            document.getElementById(
                "collaboratorSelect"
            );

        if (
            !wrapper ||
            !select ||
            !["segreteria","responsabile"].includes(roleSession())
        ) {
            return;
        }

        const expanded = await buildExpandedVisibility();
        const ids = expanded.ids;
        const names = expanded.names;
        expandedCollaboratorNames = names;

        wrapper.classList.add(
            "visible"
        );

        const myUid =
            String(sessioneConsulente?.user?.uid || "").trim();

        select.innerHTML =
            `<option value="">Tutte le pratiche del gruppo</option>`
            +
            `<option value="__mine__">Le mie pratiche</option>`
            +
            ids
                .filter(uid => uid !== myUid)
                .map(uid =>
                    `<option value="${uid}">${
                        String(names[uid] || uid)
                            .replace(/&/g, "&amp;")
                            .replace(/</g, "&lt;")
                            .replace(/>/g, "&gt;")
                    }</option>`
                ).join("");
    }

    async function loadPracticeDocsByOwners(ownerUids) {
        const ids =
            Array.from(
                new Set(
                    (ownerUids || [])
                        .map(x => String(x || "").trim())
                        .filter(Boolean)
                )
            );

        if (!ids.length) {
            return [];
        }

        const result =
            new Map();

        /*
         * Firestore consente un numero limitato di valori per la query "in".
         * Usiamo blocchi prudenti da 30 per supportare reti più ampie.
         */
        for (
            let i = 0;
            i < ids.length;
            i += 30
        ) {
            const chunk =
                ids.slice(
                    i,
                    i + 30
                );

            const snap =
                await db.collection("pratiche_mutuo")
                    .where(
                        "consulente_uid",
                        "in",
                        chunk
                    )
                    .get();

            snap.forEach(doc =>
                result.set(
                    doc.id,
                    doc
                )
            );
        }

        return Array.from(
            result.values()
        );
    }



    async function contaDocumentiFascicolo(idPratica) {
        const id = String(idPratica || "").trim();
        if (!id) return 0;

        const varianti = Array.from(new Set([
            id,
            id.replace(/_/g, " "),
            id.replace(/_/g, "-")
        ]));

        for (const variante of varianti) {
            try {
                const res = await storage.ref(`Fascicoli/${variante}`).listAll();
                if (res.items.length > 0) return res.items.length;
            } catch (error) {
                console.warn(`Conteggio documenti non disponibile per ${variante}:`, error);
            }
        }
        return 0;
    }


    async function caricaClientiDaDB() {
        document.getElementById('loadingIndicator').style.display = 'block';
        tuttiIClienti = [];

        try {
            sessioneConsulente =
                sessioneConsulente ||
                await CredipassAuth.guard();

            const role =
                roleSession();

            let docs = [];

            if (
                sessioneConsulente.isAdmin
            ) {
                const snap =
                    await db.collection("pratiche_mutuo")
                        .get();

                snap.forEach(doc =>
                    docs.push(doc)
                );

                await setupAdminPracticeFilter();
            }
            else if (
                ["segreteria","responsabile"].includes(role)
            ) {
                const expandedVisibility =
                    await buildExpandedVisibility();

                const owners =
                    expandedVisibility.ids.slice();

                /*
                 * Manteniamo anche l'UID della Segreteria, così eventuali
                 * pratiche create direttamente da questo account restano visibili.
                 */
                owners.push(
                    sessioneConsulente.user.uid
                );

                docs =
                    await loadPracticeDocsByOwners(
                        owners
                    );

                await setupCollaboratorFilter();
            }
            else {
                /*
                 * CONSULENTE:
                 * visualizza esclusivamente le pratiche assegnate a lui.
                 *
                 * collega_segnalato_uid è un'informazione di segnalazione
                 * e NON attribuisce visibilità/proprietà sulla pratica.
                 */
                const ownSnap =
                    await db.collection("pratiche_mutuo")
                        .where(
                            "consulente_uid",
                            "==",
                            sessioneConsulente.user.uid
                        )
                        .get();

                docs = [];
                ownSnap.forEach(doc =>
                    docs.push(doc)
                );
            }

            docs.forEach(doc => {
                const idDocumento =
                    doc.id;

                const datiDoc =
                    doc.data() || {};

                // Priorità al nominativo reale salvato nei campi anagrafici.
                // Alcune pratiche legacy hanno nomeCliente = "Cliente".
                const nomeDaCampi =
                    [datiDoc.cliente_nome, datiDoc.cliente_cognome]
                        .map(x => String(x || "").trim())
                        .filter(Boolean)
                        .join(" ");

                const nomeClienteLegacy =
                    String(datiDoc.nomeCliente || "").trim();

                let nomeReale =
                    String(datiDoc.cliente_nome_completo || "").trim() ||
                    nomeDaCampi ||
                    (
                        nomeClienteLegacy &&
                        nomeClienteLegacy.toLowerCase() !== "cliente"
                            ? nomeClienteLegacy
                            : ""
                    ) ||
                    idDocumento.replace(/[-_]/g, ' ');

                const nomeFormattato =
                    String(nomeReale || "")
                        .toUpperCase();

                tuttiIClienti.push({
                    idOriginale:
                        idDocumento,

                    nomeRicerca:
                        nomeFormattato,

                    ownerUid:
                        datiDoc.consulente_uid ||
                        datiDoc.workspace_uid ||
                        datiDoc.owner_uid ||
                        "",

                    dati:
                        datiDoc
                });
            });

            await Promise.all(
                tuttiIClienti.map(async cliente => {
                    cliente.documentiReali =
                        await contaDocumentiFascicolo(cliente.idOriginale);
                })
            );

            document.getElementById('loadingIndicator').style.display = 'none';
            mostraClienti(tuttiIClienti);

        } catch (error) {
            console.error(error);
            alert(
                "Errore di connessione a Firebase.\n\n"
                +
                (
                    error?.message ||
                    ""
                )
            );
            document.getElementById('loadingIndicator').style.display = 'none';
        }
    }

    function mostraClienti(lista) {
        const container = document.getElementById('clientiContainer');
        const noResults = document.getElementById('noResults');
        container.innerHTML = '';

        if (lista.length === 0) {
            noResults.style.display = 'block'; return;
        } else {
            noResults.style.display = 'none';
        }

        lista.forEach(cliente => {
            const card = document.createElement('div');
            

            const fileCaricati = Number(cliente.documentiReali || 0);
            const statoDocumenti =
                fileCaricati > 0
                    ? `${fileCaricati} ${fileCaricati === 1 ? "documento" : "documenti"} nel fascicolo`
                    : "Nessun documento nel fascicolo";


            const ownerNames =
                Object.assign({}, collaboratorNameMap(), expandedCollaboratorNames);

            const ownerLabel =
                ownerNames[cliente.ownerUid]
                ||
                (
                    cliente.ownerUid ===
                    sessioneConsulente?.user?.uid
                        ? "Pratica propria"
                        : ""
                );

            const statoPratica = cliente.dati.stato_pratica || "da_istruire";
            const statoCfg = getStatoPraticaConfig(statoPratica);

            const badgeHtml = `
                <span class="badge-practice-state" style="background:${statoCfg.badge};">
                    <i class="fas fa-circle"></i> ${statoCfg.label}
                </span>
            `;

            card.className = "client-card";
            card.style.borderLeftColor = statoCfg.border;
            card.style.backgroundColor = statoCfg.bg;
            card.innerHTML = `
                <div class="client-info-container">
                    <div class="client-data" onclick="window.location.href='dashboard-consulente.html?clienteId=${cliente.idOriginale}'">
                        <h3><i class="fas fa-user-circle" style="color:#002d72;"></i> ${cliente.nomeRicerca} ${badgeHtml}</h3>
                        <p>ID: ${cliente.idOriginale}</p>
                        <div class="client-progress-info"><i class="fas fa-folder-open"></i> ${statoDocumenti}</div>
                        ${cliente.dati.collega_segnalato_uid ? `<div class="client-progress-info"><i class="fas fa-user-friends"></i> Collega associato: ${String(cliente.dati.collega_segnalato_nome || cliente.dati.collega_segnalato_uid).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div>` : ""}
                        ${(sessioneConsulente?.isAdmin || ["segreteria","responsabile"].includes(roleSession())) && ownerLabel ? `<div class="client-progress-info"><i class="fas fa-user-tie"></i> Pratica di: ${ownerLabel}</div>` : ""}
                    </div>
                    <div class="client-actions">
                        ${sessioneConsulente?.isAdmin ? `
                        <button class="btn-assign" title="Assegna pratica a un utente"
                                onclick="apriAssegnaPratica('${cliente.idOriginale}', ${JSON.stringify(cliente.nomeRicerca).replace(/"/g, '&quot;')})">
                            <i class="fas fa-user-check"></i> Assegna
                        </button>` : ""}
                        <button class="btn-delete" title="Elimina Pratica" onclick="eliminaPratica('${cliente.idOriginale}', '${cliente.nomeRicerca}')">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                        <div class="btn-fascicolo" onclick="window.location.href='dashboard-consulente.html?clienteId=${cliente.idOriginale}'">
                            Apri <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }


    async function apriAssegnaPratica(practiceId, practiceName) {
        if (!sessioneConsulente?.isAdmin) return;

        practiceToAssign = {
            id: String(practiceId || "").trim(),
            nome: String(practiceName || "").trim()
        };

        document.getElementById("assignPracticeName").textContent =
            practiceToAssign.nome || practiceToAssign.id;

        document.getElementById("assignUserSearch").value = "";
        document.getElementById("assignPracticeModal").classList.add("open");

        try {
            await loadAdminActiveUsers();
            renderAssignUsers();
            setTimeout(() => document.getElementById("assignUserSearch")?.focus(), 50);
        } catch (error) {
            console.error(error);
            alert("Errore caricamento utenti: " + (error?.message || error));
            chiudiAssegnaPratica();
        }
    }

    function chiudiAssegnaPratica() {
        document.getElementById("assignPracticeModal")?.classList.remove("open");
        practiceToAssign = null;
    }

    function renderAssignUsers() {
        const list = document.getElementById("assignUserList");
        if (!list) return;

        const q =
            String(document.getElementById("assignUserSearch")?.value || "")
                .trim()
                .toLowerCase();

        const current =
            tuttiIClienti.find(x => x.idOriginale === practiceToAssign?.id);
        const currentOwner = String(current?.ownerUid || "");

        const users = adminActiveUsers.filter(u => {
            const haystack =
                `${u.nome || ""} ${u.cognome || ""} ${u.email || ""} ${u.ruolo || ""}`
                    .toLowerCase();
            return (!q || haystack.includes(q)) && String(u.uid || "") !== currentOwner;
        });

        list.innerHTML = users.length
            ? users.map(u => {
                const name =
                    `${u.nome || ""} ${u.cognome || ""}`.trim()
                    || u.email
                    || u.uid;
                return `
                    <button class="assign-user" onclick="confermaAssegnaPratica('${escapeHtmlAttr(u.uid)}')">
                        <span>
                            <strong>${escapeHtml(name)}</strong>
                            <small>${escapeHtml(u.email || u.uid)}</small>
                        </span>
                        <span class="assign-role">${escapeHtml(u.ruolo || "utente")}</span>
                    </button>`;
              }).join("")
            : `<div style="padding:18px;text-align:center;color:#7b8794;font-size:11px;">Nessun utente trovato.</div>`;
    }

    async function confermaAssegnaPratica(targetUid) {
        if (!sessioneConsulente?.isAdmin || !practiceToAssign?.id) return;

        const user = adminActiveUsers.find(u => String(u.uid) === String(targetUid));
        if (!user) return;

        const targetName =
            `${user.nome || ""} ${user.cognome || ""}`.trim()
            || user.email
            || user.uid;

        if (!confirm(
            `Assegnare la pratica "${practiceToAssign.nome}" a ${targetName}?\n\n` +
            `La pratica non risulterà più tra "Le mie pratiche" dell'attuale titolare.`
        )) return;

        const practiceId = practiceToAssign.id;

        try {
            const callable =
                functionsFirebase.httpsCallable("assignPracticeOwner");

            await callable({
                practice_id: practiceId,
                target_uid: targetUid
            });

            chiudiAssegnaPratica();
            await caricaClientiDaDB();

            alert(`Pratica assegnata a ${targetName}.`);
        } catch (error) {
            console.error("assignPracticeOwner:", error);
            alert(
                "Errore assegnazione pratica:\n" +
                (error?.message || error?.details || String(error))
            );
        }
    }


    function filtraClienti() {
        const filtro =
            String(
                document.getElementById('searchInput')?.value ||
                ""
            )
            .toUpperCase();

        const ownerFilter =
            String(
                document.getElementById("collaboratorSelect")?.value ||
                ""
            );

        const filtrati =
            tuttiIClienti.filter(cliente => {
                const ownerText =
                    String(
                        expandedCollaboratorNames[cliente.ownerUid] ||
                        collaboratorNameMap()[cliente.ownerUid] ||
                        ""
                    ).toUpperCase();

                const searchable =
                    `${cliente.nomeRicerca} ${cliente.idOriginale} ${ownerText}`.toUpperCase();

                const matchesName =
                    searchable.includes(
                        filtro
                    );

                const myUid =
                    String(sessioneConsulente?.user?.uid || "").trim();

                const matchesOwner =
                    !ownerFilter ||
                    (
                        ownerFilter === "__mine__"
                            ? cliente.ownerUid === myUid
                            : cliente.ownerUid === ownerFilter
                    );

                return (
                    matchesName &&
                    matchesOwner
                );
            });

        mostraClienti(
            filtrati
        );
    }

    // --- FUNZIONE DI ELIMINAZIONE DEFINITIVA ---
    async function eliminaPratica(idPratica, nomeCliente) {
        const conferma = confirm(`ATTENZIONE!\n\nSei sicuro di voler eliminare definitivamente la pratica di: ${nomeCliente}?\n\nQuesta azione cancellerà tutti i dati e i documenti dal Cloud in modo irreversibile.`);
        
        if (!conferma) return; // Se l'utente clicca Annulla, si ferma qui

        document.getElementById('loadingIndicator').innerHTML = '<i class="fas fa-trash-alt fa-bounce fa-2x" style="color:#dc3545;"></i><p>Eliminazione pratica in corso...</p>';
        document.getElementById('loadingIndicator').style.display = 'block';
        document.getElementById('clientiContainer').innerHTML = ''; // Nasconde la lista durante l'operazione

        try {
            // 1. ELIMINA LA CARTELLA DEI FILE DALLO STORAGE (Se esiste)
            const listRef = storage.ref(`Fascicoli/${idPratica}`);
            try {
                const res = await listRef.listAll();
                // Cancella tutti i file uno per uno (Firebase non fa cancellare le cartelle piene in un colpo solo)
                const deletePromises = res.items.map((itemRef) => itemRef.delete());
                await Promise.all(deletePromises);
                console.log(`Cartella Storage per ${idPratica} svuotata.`);
            } catch (e) {
                console.log(`Nessun file trovato nello Storage per ${idPratica}, o cartella inesistente.`);
            }

            // 2. ELIMINA IL DOCUMENTO DAL DATABASE (FIRESTORE)
            await db.collection("pratiche_mutuo").doc(idPratica).delete();
            console.log(`Dati Firestore per ${idPratica} eliminati.`);

            alert(`✅ Pratica di ${nomeCliente} eliminata con successo dal Database e dallo Spazio di Archiviazione.`);
            
            // Ricarica la lista pulita
            document.getElementById('searchInput').value = ""; // Resetta la barra di ricerca
            await caricaClientiDaDB();

        } catch (error) {
            console.error("Errore durante l'eliminazione:", error);
            alert("❌ Errore durante l'eliminazione della pratica. Riprova.");
            document.getElementById('loadingIndicator').style.display = 'none';
            caricaClientiDaDB(); // Ricarica la pagina in caso di errore per sicurezza
        }
    }

    window.onload = async () => {
        try {
            sessioneConsulente =
                await CredipassAuth.guard();
            await caricaClientiDaDB();
        } catch (error) {
            console.error("Accesso archivio negato:", error);
        }
    };
</script>
