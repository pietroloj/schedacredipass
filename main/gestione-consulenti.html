<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulenti - Credipass</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
<script src="/main/auth-guard.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;font-family:Poppins,sans-serif;padding:24px;color:#263238}
.box{max-width:1180px;margin:auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.12)}
.head{padding:22px 26px;background:#002d72;color:#fff;border-bottom:5px solid #C99700;display:flex;justify-content:space-between;align-items:center}.head h1{font-size:19px;margin:0}.head a{color:#fff;text-decoration:none;font-size:10px;font-weight:800}
.body{padding:24px}.grid{display:grid;grid-template-columns:.85fr 1.35fr;gap:18px;align-items:start}.card{border:1px solid #e1e6eb;border-radius:10px;padding:17px}
h2{font-size:13px;color:#002d72;margin:0 0 13px}label{display:block;font-size:8px;font-weight:800;text-transform:uppercase;margin:8px 0 4px;color:#68737e}
input,select{width:100%;padding:9px;border:1px solid #dce3ea;border-radius:7px;font-family:inherit;font-size:10px;background:#fff}
button{border:0;border-radius:7px;background:#002d72;color:#fff;padding:9px 12px;font-family:inherit;font-size:9px;font-weight:800;cursor:pointer}
#create{margin-top:12px;width:100%}.user{padding:12px 0;border-bottom:1px solid #edf0f3;font-size:10px}.user-main{display:grid;grid-template-columns:minmax(0,1fr) 150px 90px;gap:9px;align-items:center}
.user-email{color:#7b858f;font-size:9px;word-break:break-all}.badge{font-size:8px;font-weight:800;color:#002d72;background:#eef3f8;border-radius:999px;padding:5px 8px;display:inline-block;margin-top:4px}
.visibility{margin-top:10px;padding:10px;background:#f7f9fb;border:1px solid #e5eaf0;border-radius:8px}.visibility-title{font-size:8px;font-weight:800;color:#002d72;text-transform:uppercase;margin-bottom:7px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.check{display:flex;align-items:center;gap:6px;font-size:9px}.check input{width:auto;margin:0}.btn-visibility{margin-top:9px;background:#C99700;color:#002d72}.msg{font-size:9px;margin-top:8px;min-height:14px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.user-main{grid-template-columns:1fr}.checks{grid-template-columns:1fr}}
</style></head><body>
<div class="box"><div class="head"><h1><i class="fas fa-users-cog"></i> Gestione Consulenti</h1><a href="/">TORNA ALLA SCHEDA</a></div>
<div class="body"><div class="grid">
<div class="card"><h2>Crea nuovo consulente</h2>
<label>Nome</label><input id="nome"><label>Cognome</label><input id="cognome"><label>Email</label><input id="email" type="email">
<label>Password temporanea</label><input id="password" type="password"><label>Ruolo</label>
<select id="ruolo"><option value="consulente">Consulente</option><option value="responsabile">Responsabile</option><option value="segreteria">Segreteria</option><option value="admin">Admin</option></select>
<button id="create">CREA ACCOUNT + WORKSPACE</button><div id="msg" class="msg"></div></div>
<div class="card"><h2>Consulenti registrati</h2><div id="users">Caricamento...</div></div>
</div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyDDRWJpEhFb2zBB9MlkbEel_9cXOTTKBJ4",authDomain:"consulenza-credipass.firebaseapp.com",projectId:"consulenza-credipass",storageBucket:"consulenza-credipass.firebasestorage.app"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(),fns=firebase.app().functions("us-central1");let allUsers=[];
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const canHave=r=>["responsabile","segreteria"].includes(r);
async function listUsers(){
 const box=document.getElementById("users"),snap=await db.collection("consulenti").get();allUsers=[];snap.forEach(doc=>allUsers.push({uid:doc.id,...(doc.data()||{})}));
 allUsers.sort((a,b)=>String(a.email||"").localeCompare(String(b.email||""),"it"));box.innerHTML="";
 allUsers.forEach(d=>{const role=String(d.ruolo||"consulente").toLowerCase(),sel=new Set(Array.isArray(d.collaboratori_visibili)?d.collaboratori_visibili:[]);
 const collaborators=allUsers.filter(x=>x.uid!==d.uid&&x.attivo!==false&&String(x.ruolo||"").toLowerCase()==="consulente");
 const el=document.createElement("div");el.className="user";el.innerHTML=`<div class="user-main"><div><strong>${esc(d.nome||"")} ${esc(d.cognome||"")}</strong><div class="user-email">${esc(d.email||"")}</div><span class="badge">${esc(role.toUpperCase())}</span></div>
 <select class="role-select" data-uid="${esc(d.uid)}"><option value="consulente" ${role==="consulente"?"selected":""}>Consulente</option><option value="responsabile" ${role==="responsabile"?"selected":""}>Responsabile</option><option value="segreteria" ${role==="segreteria"?"selected":""}>Segreteria</option><option value="admin" ${role==="admin"?"selected":""}>Admin</option></select>
 <button data-role="${esc(d.uid)}">SALVA RUOLO</button></div>
 <div class="visibility" id="vis-${esc(d.uid)}" style="display:${canHave(role)?"block":"none"}"><div class="visibility-title"><i class="fas fa-users"></i> Collaboratori visibili</div><div class="checks">${collaborators.map(c=>`<label class="check"><input type="checkbox" value="${esc(c.uid)}" ${sel.has(c.uid)?"checked":""}><span>${esc((c.nome||"")+" "+(c.cognome||""))}</span></label>`).join("")||"<span>Nessun consulente disponibile.</span>"}</div><button class="btn-visibility" data-vis="${esc(d.uid)}">SALVA COLLABORATORI</button></div><div class="msg" id="msg-${esc(d.uid)}"></div>`;
 box.appendChild(el);});
 box.querySelectorAll(".role-select").forEach(x=>x.onchange=()=>{const v=document.getElementById("vis-"+x.dataset.uid);if(v)v.style.display=canHave(x.value)?"block":"none"});
 box.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>saveRole(b.dataset.role));box.querySelectorAll("[data-vis]").forEach(b=>b.onclick=()=>saveVis(b.dataset.vis));
}
async function saveRole(uid){const s=document.querySelector(`.role-select[data-uid="${CSS.escape(uid)}"]`),m=document.getElementById("msg-"+uid);try{m.textContent="Salvataggio...";await fns.httpsCallable("updateConsultantPermissions")({uid,ruolo:s.value});m.style.color="#23723c";m.textContent="✅ Ruolo aggiornato.";await listUsers()}catch(e){console.error(e);m.style.color="#b42318";m.textContent=e?.message||"Errore."}}
async function saveVis(uid){const r=document.getElementById("vis-"+uid),m=document.getElementById("msg-"+uid),ids=[...r.querySelectorAll('input:checked')].map(x=>x.value);try{m.textContent="Salvataggio...";await fns.httpsCallable("updateConsultantVisibility")({uid,collaboratori_visibili:ids});m.style.color="#23723c";m.textContent="✅ Collaboratori aggiornati.";await listUsers()}catch(e){console.error(e);m.style.color="#b42318";m.textContent=e?.message||"Errore."}}
document.getElementById("create").onclick=async()=>{const d={nome:nome.value.trim(),cognome:cognome.value.trim(),email:email.value.trim(),password:password.value,ruolo:ruolo.value},m=document.getElementById("msg");if(!d.nome||!d.cognome||!d.email||d.password.length<8){m.style.color="#b42318";m.textContent="Completa i campi. Password minimo 8 caratteri.";return}try{await fns.httpsCallable("createConsultant")(d);m.style.color="#23723c";m.textContent="✅ Account e workspace creati.";await listUsers()}catch(e){m.style.color="#b42318";m.textContent=e?.message||"Errore creazione."}};
(async()=>{await CredipassAuth.guard({adminOnly:true});await listUsers()})();
</script></body></html>
