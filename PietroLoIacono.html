<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Generatore QR Credipass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-6 font-sans">
  
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center border-t-4 border-[#0A2A5E]">
    <h2 class="text-2xl font-bold text-[#0A2A5E] mb-2">QR Code Ufficiale</h2>
    <p class="text-gray-500 mb-6 text-sm">Inserisci il link a cui puntava il tuo QR in bianco e nero per generare la versione a colori ad alta risoluzione.</p>
    
    <input type="text" id="qr-data" placeholder="es. https://www.credipass.it/..." class="w-full border-2 border-gray-200 p-3 rounded-xl mb-4 focus:outline-none focus:border-[#FFC627]">
    
    <button onclick="generateQR()" class="bg-[#0A2A5E] text-white px-6 py-3 rounded-xl font-bold mb-6 hover:bg-blue-900 w-full transition-colors shadow-md">
      Genera Anteprima
    </button>
    
    <!-- Qui appare il QR -->
    <div id="qr-preview" class="flex justify-center mb-6 overflow-hidden rounded-xl border-2 border-gray-50 empty:border-none"></div>
    
    <button id="download-btn" onclick="downloadQR()" class="hidden bg-[#FFC627] text-[#0A2A5E] px-6 py-3 rounded-xl font-bold w-full hover:bg-yellow-400 transition-colors shadow-md">
      Scarica Immagine (PNG)
    </button>
  </div>

  <script>
    let qrCode;

    function generateQR() {
      const data = document.getElementById('qr-data').value;
      if(!data) {
        alert("Inserisci un link o un testo prima di generare!");
        return;
      }

      // Pulisce l'anteprima precedente
      document.getElementById('qr-preview').innerHTML = "";
      
      // Configurazione con i colori del brand
      qrCode = new QRCodeStyling({
        width: 300, // Dimensione per l'anteprima a schermo
        height: 300,
        data: data,
        image: "https://drive.google.com/uc?export=view&id=1_eMVpzO46cYroK7aVAQ8UfBcDAD83nwB", // Logo Credipass
        dotsOptions: { color: "#FFC627", type: "rounded" },
        cornersSquareOptions: { color: "#0A2A5E", type: "extra-rounded" },
        cornersDotOptions: { color: "#0A2A5E", type: "dot" },
        imageOptions: { crossOrigin: "anonymous", margin: 10 }
      });

      // Mostra a schermo
      qrCode.append(document.getElementById("qr-preview"));
      // Rivela il tasto di download
      document.getElementById('download-btn').classList.remove('hidden');
    }

    function downloadQR() {
      // Scarica il file in altissima risoluzione (1000x1000) per la stampa
      qrCode.download({ name: "QR_Code_Credipass", extension: "png" });
    }
  </script>
</body>
</html>
